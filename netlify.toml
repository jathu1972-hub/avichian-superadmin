# AVICHIAN Super Admin — permanent Netlify SPA
# Site: connect GitHub repo jathu1972-hub/avichian-superadmin
# Permanent URL (after deploy): https://avichian-superadmin.netlify.app
# Custom domain (optional):    https://admin.avichian.com
#
# REQUIRED env:
#   VITE_API_URL = https://YOUR-BACKEND-HOST

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
